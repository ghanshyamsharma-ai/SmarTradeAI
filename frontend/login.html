<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · SmarTraderAI</title>
  <link rel="stylesheet" href="/static/css/style.css?v=layout-2" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-main">
        <div class="brand-cube">S</div>
        <img class="brand-logo" src="/static/assets/smartraderai-logo.png?v=exact-1" alt="SmarTraderAI" />
      </div>
      <div class="brand-sub">PRO TERMINAL</div>
    </div>
    <h2 id="title">Welcome back</h2>
    <p class="sub">Sign in to your live market workspace.</p>

    <div class="tabs">
      <button class="active" data-mode="login">Sign in</button>
      <button data-mode="register">Create account</button>
    </div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label>Full name</label><input id="name" autocomplete="name" placeholder="Your name" />
      </div>
      <div class="field">
        <label>Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters" />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a16.9 16.9 0 0 1-3.2 3.8M6.2 7.9A16.7 16.7 0 0 0 2 12s3.5 6 10 6a10.4 10.4 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="error"></div>
      <button class="btn primary" id="submit" style="width:100%;padding:12px">Sign in</button>
    </form>
    <p class="note" style="margin-top:18px">Market data is provided by Yahoo Finance. NSE quotes may be delayed. No orders are placed automatically.</p>
  </div>
  <script>
    const $ = (s) => document.querySelector(s);
    const pw = $('#password');
    const pwToggle = $('#pwToggle');
    const eyeOpen = $('#eyeOpen');
    const eyeOff = $('#eyeOff');
    pwToggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      if (show) {
        eyeOpen.setAttribute('hidden', '');
        eyeOff.removeAttribute('hidden');
      } else {
        eyeOpen.removeAttribute('hidden');
        eyeOff.setAttribute('hidden', '');
      }
      pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      pwToggle.setAttribute('aria-pressed', String(show));
    });
    let mode = 'login';
    document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
      mode = b.dataset.mode;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
      $('#nameField').style.display = mode === 'register' ? 'block' : 'none';
      $('#title').textContent = mode === 'register' ? 'Create your account' : 'Welcome back';
      $('#submit').textContent = mode === 'register' ? 'Create account' : 'Sign in';
      $('#error').textContent = '';
    }));
    $('#authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#error').textContent = '';
      $('#submit').disabled = true;
      try {
        const body = { email: $('#email').value.trim(), password: $('#password').value };
        if (mode === 'register') body.name = $('#name').value.trim();
        const res = await fetch(`/api/auth/${mode}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Authentication failed');
        localStorage.setItem('stai_token', data.token);
        localStorage.setItem('stai_user', JSON.stringify(data.user));
        localStorage.removeItem('ssai_token');
        localStorage.removeItem('ssai_user');
        localStorage.removeItem('stap_token');
        localStorage.removeItem('stap_user');
        location.href = '/';
      } catch (err) {
        $('#error').textContent = err.message;
      } finally { $('#submit').disabled = false; }
    });
    if (localStorage.getItem('stai_token') || localStorage.getItem('ssai_token') || localStorage.getItem('stap_token')) location.href = '/';
  </script>
</body>
</html>
